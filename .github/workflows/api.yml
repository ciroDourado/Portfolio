name: API
on:
  push:
    branches:
      - main
    paths:
      - 'applications/api/**'
      - '.github/workflows/api.yml'

jobs:
  build-deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: applications/api/go.sum

      - name: Build Binary
        working-directory: ./applications/api
        run: go build -o main ./cmd/api

      - name: Deploy and Restart
        run: |
          sudo systemctl stop portfolio-api
          
          rm -f ${{ secrets.REMOTE_PATH }}/api/main
          cp applications/api/main ${{ secrets.REMOTE_PATH }}/api/main
          
          chmod +x ${{ secrets.REMOTE_PATH }}/api/main
          
          sudo systemctl start portfolio-api
