name: Asgard
on:
  push:
    branches: [ main ]

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache-dependency-path: applications/api/go.sum

      - name: Build Binary
        working-directory: ./applications/api
        run: GOOS=linux GOARCH=amd64 go build -o main ./cmd/api

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-binary
          path: applications/api/main

  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: applications/web/package-lock.json

      - name: Install Dependencies and Build
        working-directory: ./applications/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}
        run: |
          npm ci
          npm run build
          cp -r public .next/standalone/applications/web/public
          cp -r .next/static .next/standalone/applications/web/.next/static

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: applications/web/.next/standalone/applications/web

  build-cms:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Dependencies
        working-directory: ./applications/cms
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cms-build
          path: applications/cms

  deploy:
    needs: [build-api, build-web, build-cms]
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Copy Files (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "api-binary,web-build,cms-build"
          target: "~/temp_deploy"
          strip_components: 1

      - name: Finalize Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl stop portfolio-api
            mv ~/temp_deploy/api-binary ${{ secrets.REMOTE_PATH }}/api/main
            chmod +x ${{ secrets.REMOTE_PATH }}/api/main
            sudo systemctl start portfolio-api
            
            rsync -a --delete ~/temp_deploy/web-build/ ${{ secrets.REMOTE_PATH }}/web/
            cd ${{ secrets.REMOTE_PATH }}/web
            pm2 restart portfolio-web || pm2 start server.js --name portfolio-web
            
            rsync -a --delete --exclude 'storage' ~/temp_deploy/cms-build/ ${{ secrets.REMOTE_PATH }}/cms/
            cd ${{ secrets.REMOTE_PATH }}/cms
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            sudo chown -R ${{ secrets.REMOTE_WEBSERVER }}:${{ secrets.REMOTE_WEBSERVER }} storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            
            rm -rf ~/temp_deploy