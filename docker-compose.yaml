services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d portfolio" ]
      interval: 5s
      timeout: 5s
      retries: 5

  cms:
    build:
      context: ./applications/cms
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: portfolio
      DB_USERNAME: user
      DB_PASSWORD: password
    ports:
      - "8000:8000"
    volumes:
      - ./applications/cms:/app
    networks:
      - internal

  api:
    build:
      context: ./applications/api
      dockerfile: Dockerfile
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: portfolio
      DB_USER: user
      DB_PASSWORD: password
    ports:
      - "8080:8080"
    volumes:
      - ./applications/api:/app
      - go_cache:/go
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./applications/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8080/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./applications/web:/app
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  database_data:
  go_cache:

networks:
  internal:
    driver: bridge
